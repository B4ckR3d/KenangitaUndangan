<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#18181b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3f3f46;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#grad)" />
  <rect width="640" height="400" fill="url(#grid)" />
  
  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="600" height="360" rx="16" fill="none" stroke="#a1a1aa" stroke-opacity="0.3" stroke-width="2" />
  <rect x="28" y="28" width="584" height="344" rx="12" fill="rgba(0,0,0,0.3)" stroke="#a1a1aa" stroke-opacity="0.15" stroke-width="1" />
  
  <!-- Decorative Corner Embellishments -->
  <circle cx="28" cy="28" r="6" fill="#a1a1aa" opacity="0.6"/>
  <circle cx="612" cy="28" r="6" fill="#a1a1aa" opacity="0.6"/>
  <circle cx="28" cy="372" r="6" fill="#a1a1aa" opacity="0.6"/>
  <circle cx="612" cy="372" r="6" fill="#a1a1aa" opacity="0.6"/>
  
  <!-- Center Badge -->
  <g transform="translate(320, 200)">
    <circle cx="0" cy="-40" r="32" fill="#a1a1aa" fill-opacity="0.15" stroke="#a1a1aa" stroke-width="1.5" />
    <text x="0" y="-30" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" text-anchor="middle" fill="#ffffff">💍</text>
    
    <text x="0" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" text-anchor="middle" fill="#ffffff" letter-spacing="2">
      PHINISI MAROON
    </text>
    <text x="0" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" text-anchor="middle" fill="#94a3b8" letter-spacing="1">
      KENANGITA THEME COLLECTION
    </text>
    <rect x="-80" y="62" width="160" height="26" rx="8" fill="#a1a1aa" />
    <text x="0" y="79" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" text-anchor="middle" fill="#ffffff" letter-spacing="1">
      EXCLUSIVE TEMPLATE
    </text>
  </g>
</svg>